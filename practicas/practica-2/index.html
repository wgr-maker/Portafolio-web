<!DOCTYPE html>
<!-- Autor: Diana Paola Nava Gutierrez -->
<!-- Fecha de creación: 17/09/2026 -->
<html lang="es">
    <head>
        <!-- Permite mostrar correctamente letras, acentos y caracteres especiales -->
        <meta charset="UTF-8">

        <!-- Texto que aparece en la pestaña del navegador -->
        <title>Práctica 2</title>
    </head>

    <!-- En el body se coloca todo el contenido visible de la página -->
    <body>
        <!-- Logotipo del Tecnologico de Acapulco -->
        <img src="logo3.jpg" width="100" height="100" alt="Logotipo del Campus Acapulco">
        <br>

        <!-- Logotipo del Tecnologico Nacional de Mexico -->
        <img src="logotec.png" width="100" alt="Logotipo del Tecnológico Nacional de México">
        <br>

        <!-- Enlace al sitio del Tecnologico; target="_blank" lo abre en otra pestaña -->
        <a href="https://acapulco.tecnm.mx/" target="_blank">Ir a TecNM</a>

        <!-- Los saltos de linea dejan espacio antes de la primera tabla -->
        <br><br>

        <!-- center coloca la tabla en el centro de la pagina -->
        <center>
            <!-- border="1" muestra las lineas que dividen la tabla -->
            <table border="1">
                <!-- Primera fila: encabezados con fondo rosa pastel -->
                <tr bgcolor="#F8C8DC">
                    <td width="300">Nombre</td>
                    <td width="200">Numero de control</td>
                    <td width="200">Carrera</td>
                    <td width="80">Semestre</td>
                </tr>

                <!-- Filas con los datos de las estudiantes -->
                <tr>
                    <td>Estrella Itzel</td>
                    <td>23321179</td>
                    <td>Sistemas</td>
                    <td>7</td>
                </tr>
                <tr>
                    <td>Diana Noriega</td>
                    <td>23321089</td>
                    <td>Sistemas</td>
                    <td>7</td>
                </tr>
                <tr>
                    <td>Ricardo Daniel</td>
                    <td>23320758</td>
                    <td>Sistemas</td>
                    <td>7</td>
                </tr>
            </table>
        </center>

        <!-- Espacio entre las dos tablas -->
        <br><br><br>

        <center>
            <!-- Tabla que contiene las imagenes y los enlaces de Starbucks -->
            <table width="600" border="1">
                <!-- Primera fila: imagenes de Starbucks -->
                <tr>
                    <td width="200"><img src="2.png" width="200" alt="Logotipo horizontal de Starbucks"></td>
                    <td width="200"><img src="1.png" width="200" alt="Logotipo circular de Starbucks"></td>
                    <td width="200"><img src="3.jpg" width="200" alt="Logotipo clasico de Starbucks"></td>
                </tr>

                <!-- Segunda fila: enlaces relacionados con Starbucks -->
                <tr bgcolor="#F8C8DC">
                    <td><a href="https://www.starbucks.com.mx/" target="_blank">Página de Starbucks</a></td>
                    <td><a href="https://rewards.starbucks.mx/" target="_blank">Starbucks Rewards</a></td>
                    <td><a href="https://historias.starbucks.com/" target="_blank">Historias Starbucks</a></td>
                </tr>
            </table>
        </center>

        <!-- Espacio al final de la pagina -->
        <br><br><br><br><br><br>
    </body>
</html>
